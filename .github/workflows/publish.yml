name: Publish to GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Add CNAME
        run: echo "imenrique.com" > out/CNAME
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          publish_branch: main
          publish_dir: ./out
